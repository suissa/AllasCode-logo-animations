<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AllasCode — Logo Animation</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#00040b;overflow:hidden}.stage{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#07182b 0,#020a14 38%,#000 82%);perspective:1200px}.scene{position:relative;width:min(92vw,820px);aspect-ratio:1}.logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;filter:blur(12px) brightness(1.6);transform:scale(.78) translateZ(-100px);animation:reveal 2.4s cubic-bezier(.16,1,.3,1) .35s forwards,breathe 5s ease-in-out 3s infinite}.halo{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.25),rgba(0,87,255,.09) 42%,transparent 72%);filter:blur(35px);opacity:0;animation:halo 2.2s .25s forwards,pulse 4s 2.5s infinite}.orbit{position:absolute;left:12%;top:18%;width:76%;height:48%;border:2px solid transparent;border-top-color:#20eaff;border-right-color:#1269ff;border-radius:50%;filter:drop-shadow(0 0 9px #12bfff);opacity:0;transform:rotate(-13deg) scale(.6);animation:orbit 1.8s .6s ease-out forwards}.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 22px #20eaff,0 0 40px #1269ff;left:81%;top:22%;opacity:0;animation:spark 1.2s 1.25s ease-out forwards}.scan{position:absolute;inset:8%;overflow:hidden;opacity:0;animation:scanOn 1.4s .9s}.scan:after{content:"";position:absolute;top:0;left:-35%;width:18%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),rgba(0,230,255,.3),transparent);filter:blur(10px);transform:skewX(-16deg);animation:sweep 1.25s 1s ease-out forwards}.ground{position:absolute;left:18%;right:18%;bottom:17%;height:2px;background:linear-gradient(90deg,transparent,#16e7ff,#fff,#1269ff,transparent);box-shadow:0 0 16px #11bfff;opacity:0;animation:ground 1.1s 1.8s forwards}@keyframes reveal{0%{opacity:0;filter:blur(18px) brightness(2.2);transform:scale(.78) translateZ(-100px)}55%{opacity:1;filter:blur(0) brightness(1.35);transform:scale(1.025)}100%{opacity:1;filter:blur(0) brightness(1);transform:scale(1)}}@keyframes breathe{50%{transform:scale(1.012);filter:brightness(1.08) drop-shadow(0 0 14px rgba(0,200,255,.25))}}@keyframes halo{to{opacity:.8;transform:scale(1.18)}}@keyframes pulse{50%{opacity:.45;transform:scale(1.3)}}@keyframes orbit{0%{opacity:0;transform:rotate(-13deg) scale(.6)}55%{opacity:.9}100%{opacity:0;transform:rotate(347deg) scale(1.08)}}@keyframes spark{0%{opacity:0;transform:scale(.2)}45%{opacity:1;transform:scale(2)}100%{opacity:0;transform:scale(.3)}}@keyframes scanOn{0%,100%{opacity:0}20%,80%{opacity:1}}@keyframes sweep{to{left:120%}}@keyframes ground{0%{opacity:0;transform:scaleX(0)}50%{opacity:1}100%{opacity:0;transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.logo{opacity:1;filter:none;transform:none}}</style></head><body><main class="stage"><div class="scene"><div class="halo"></div><div class="orbit"></div><div class="spark"></div><img class="logo" src="allascode-logo.svg" alt="AllasCode"><div class="scan"></div><div class="ground"></div></div></main></body></html>
